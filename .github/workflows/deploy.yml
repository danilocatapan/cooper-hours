name: CI/CD - Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy.yml"
      - "cooper-hours-web/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack and pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate

      - name: Install dependencies
        working-directory: cooper-hours-web
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: cooper-hours-web
        run: pnpm run check

      - name: Run parser tests
        working-directory: cooper-hours-web
        run: node test_comprehensive.mjs

      - name: Determine next patch version
        id: version
        run: |
          git fetch --tags
          latest=$(git tag --list 'v1.0.*' | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            version="v1.0.0"
          else
            current=${latest#v1.0.}
            next=$((current + 1))
            version="v1.0.$next"
          fi
          echo "Calculated version: $version"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        working-directory: cooper-hours-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: cooper-hours-web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000/cooper-hours/
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          VITE_APP_VERSION=${{ steps.version.outputs.VERSION }} pnpm run dev -- --host 127.0.0.1 > /tmp/cooper-hours-vite.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS "$E2E_BASE_URL" >/dev/null; then
              pnpm run test:e2e
              pnpm run test:a11y
              exit $?
            fi
            sleep 2
          done
          cat /tmp/cooper-hours-vite.log
          exit 1

      - name: Build project
        working-directory: cooper-hours-web
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: pnpm run build

      - name: Add SPA fallback
        working-directory: cooper-hours-web
        run: cp dist/public/index.html dist/public/404.html

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: cooper-hours-web/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish version tag
        run: |
          version="${{ needs.build.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists."
            exit 0
          fi
          git tag "$version"
          git push origin "$version"
